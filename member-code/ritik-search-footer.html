<!-- Property Search Section -->
<section class="search-section" aria-label="Property search">
  <h2>Find Your Perfect Property</h2>
  <form>
    <div class="input-group">
      <label for="location">Location</label>
      <input type="text" id="location" placeholder="Enter city or location">
    </div>
    <div class="input-group">
      <label for="propertyType">Property Type</label>
      <select id="propertyType">
        <option value="Select Property">Select Property</option>
        <option>House</option>
        <option>Apartment</option>
        <option>Villa</option>
        <option>Plot</option>
      </select>
    </div>
    <div class="input-group">
      <label for="budget">Budget</label>
      <select id="budget">
        <option value="Select Budget">Select Budget</option>
        <option>Below ₹10 Lakh</option>
        <option>₹10 - ₹30 Lakh</option>
        <option>₹30 - ₹50 Lakh</option>
        <option>Above ₹50 Lakh</option>
      </select>
    </div>
    <button type="button" onclick="searchProperty()">Search Property</button>
  </form>
</section>

<!-- Footer Section -->
<footer>
  <h2>HomeNest.</h2>
  <p>Your dream home is just a search away.</p>
  <p>© 2026 HomeNest. All Rights Reserved.</p>
</footer>
